apiVersion: apps/v1
kind: Deployment

metadata:
  name: chandigarh-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: chandigarh

  template:
    metadata:
      labels:
        app: chandigarh

    spec:
      containers:
      - name: chandigarh-container
        image: chandigarh-tourism:v1

        imagePullPolicy: Never

        ports:
        - containerPort: 3000

        env:
        - name: AVIATIONSTACK_API_KEY
          valueFrom:
            secretKeyRef:
              name: chandigarh-secret
              key: api-key

        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: chandigarh-secret
              key: smtp-user

        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: chandigarh-secret
              key: smtp-pass

        - name: CONTACT_TO_EMAIL
          value: "manjotsingh77400@gmail.com"

        - name: HOST
          value: "0.0.0.0"

        - name: PORT
          value: "3000"

        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000

        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
